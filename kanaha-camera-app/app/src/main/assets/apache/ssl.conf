# SSL Configuration for Kanaha Camera Control System
# mTLS Authentication for Multi-Camera Networks
#
# This configuration enables mutual TLS (mTLS) authentication where:
# 1. Server presents certificate to clients (standard TLS)
# 2. Clients must present valid certificates to server (mutual authentication)
# 3. All communications are encrypted with TLS 1.2/1.3
# 4. HTTP/2 is enabled for performance

# SSL Engine
SSLEngine on

# SSL Protocol Configuration
# Use modern TLS versions only for security
SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
SSLHonorCipherOrder     off
SSLSessionTickets       off

# OCSP Stapling (if supported)
SSLUseStapling          off

# Server Certificate Configuration
# These files are deployed by ApacheService from assets
SSLCertificateFile      "ssl/server.crt"
SSLCertificateKeyFile   "ssl/server.key"

# Certificate Authority Configuration for mTLS
# CA certificate used to validate client certificates
SSLCACertificateFile    "ssl/ca.crt"

# Certificate Revocation List (CRL) Configuration
# Enables revocation of compromised client certificates
# To revoke a certificate:
#   1. openssl ca -revoke client.crt -config ca.cnf
#   2. openssl ca -gencrl -out ssl/ca.crl -config ca.cnf
#   3. Restart Apache or reload configuration
SSLCARevocationFile     "ssl/ca.crl"
SSLCARevocationCheck    chain

# Client Certificate Authentication (mTLS)
# This is the key configuration for mutual TLS authentication
SSLVerifyClient         require
SSLVerifyDepth          10

# SSL Options for security
SSLOptions              +StrictRequire

# Virtual Host Configuration for HTTPS/HTTP2
<VirtualHost *:8443>
    # ServerName is dynamically replaced by ApacheService using DeviceIdentifier
    # Placeholder: {{KANAHA_HOSTNAME}} → e.g., "pixel9pro.local"
    ServerName {{KANAHA_HOSTNAME}}:8443
    DocumentRoot "htdocs"

    # Enable HTTP/2 for this virtual host
    Protocols h2 http/1.1

    # SSL Configuration for this virtual host
    SSLEngine on

    # Certificate files (relative to ServerRoot)
    SSLCertificateFile      "ssl/server.crt"
    SSLCertificateKeyFile   "ssl/server.key"
    SSLCACertificateFile    "ssl/ca.crt"

    # Certificate Revocation List (CRL)
    SSLCARevocationFile     "ssl/ca.crl"
    SSLCARevocationCheck    chain

    # mTLS Authentication
    SSLVerifyClient require
    SSLVerifyDepth  10

    # Camera Control Services Location
    # This is where Axis2/C will handle camera control requests
    <Location "/services">
        # Require valid client certificate (TLS-level verification via SSLVerifyClient)
        SSLRequireSSL
        SSLVerifyClient require

        # Allow all clients that passed TLS verification
        # Note: SSLVerifyClient require already enforces client cert at TLS level
        Require all granted

        # Additional security headers
        Header always set Cache-Control "no-cache, no-store, must-revalidate"
        Header always set Pragma "no-cache"
        Header always set Expires "0"
    </Location>

    # Status endpoint for health checks
    <Location "/status">
        SSLRequireSSL
        SSLVerifyClient require
        Require all granted

        # Simple status response
        SetHandler server-status
    </Location>

    # Certificate information endpoint
    <Location "/cert-info">
        SSLRequireSSL
        SSLVerifyClient require
        Require all granted

        # Display certificate information for debugging
        SSLOptions +ExportCertData
        Header always set Content-Type "text/plain"
    </Location>

    # Logging for SSL connections
    ErrorLog "logs/ssl_error_log"
    CustomLog "logs/ssl_access_log" \
        "%t %h %{SSL_PROTOCOL}x %{SSL_CIPHER}x \"%r\" %b \"%{SSL_CLIENT_S_DN}x\""
    LogLevel warn ssl:info

    # SSL session cache disabled for Android (socache_shmcb not available)
    # SSLSessionCache         shmcb:logs/ssl_scache(512000)
    SSLSessionCacheTimeout  300

    # HTTP Strict Transport Security (HSTS)
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
</VirtualHost>

# SSL Session Configuration
# SSLRandomSeed and SSLMutex are deprecated in Apache 2.4
# Using modern defaults

# Additional security directives
SSLInsecureRenegotiation off
SSLCompression off

# Client certificate verification environment variables
# These will be available to Axis2/C for additional validation
SSLOptions +StdEnvVars +ExportCertData

# Debugging information (remove in production)
<IfDefine SSL_DEBUG>
    LogLevel debug ssl:debug
    SSLLogLevel info
</IfDefine>