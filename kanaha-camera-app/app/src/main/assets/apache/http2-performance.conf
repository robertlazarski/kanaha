# HTTP/2 Performance Optimization for Kanaha Camera Control
# Conservative configuration for Android single-process mode (-X flag)
#
# IMPORTANT: Apache runs in single-process mode on Android, so HTTP/2
# multiplexing must be severely limited to prevent hangs on older devices.

<IfModule http2_module>
    # HTTP/2 Protocol Configuration
    Protocols h2 http/1.1

    # Enable direct HTTP/2 mode
    H2Direct on

    # CRITICAL: Limit to single stream for single-process compatibility
    # This prevents multiplexing issues on older/slower devices (e.g., Moto X4)
    # Default is 100, but single-process mode can't handle concurrent streams
    H2MaxSessionStreams 1

    # Stream timeout - prevent hanging streams (30 seconds)
    H2StreamTimeout 30

    # Reduce window size for lower memory usage (64KB instead of default 64KB-1MB)
    H2WindowSize 65535

    # Disable server push (not needed for JSON-RPC, reduces complexity)
    H2Push off

    # Upgrade from HTTP/1.1 to HTTP/2
    H2Upgrade on

    # Limit workers for single-process mode
    H2MinWorkers 1
    H2MaxWorkers 2
</IfModule>

# General timeout settings to prevent hanging connections
Timeout 30
SSLSessionCacheTimeout 60

# Security headers for camera control
<IfModule headers_module>
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
</IfModule>
