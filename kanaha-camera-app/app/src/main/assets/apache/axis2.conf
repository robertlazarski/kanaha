# Axis2/C Module Configuration for Kanaha Camera Control
# JSON-RPC over HTTP/2+mTLS Integration

<IfModule axis2_module>
    # Axis2/C Repository Path (contains services, modules, axis2.xml)
    Axis2RepoPath "axis2c"

    # Log File Location (relative to ServerRoot)
    Axis2LogFile "logs/axis2.log"

    # Log Level (trace, debug, info, warn, error, critical)
    Axis2LogLevel info

    # Maximum Log File Size (bytes)
    Axis2MaxLogFileSize 10485760

    # Global Memory Pool Size (bytes)
    Axis2GlobalPoolSize 16777216

    # Service URL Prefix
    Axis2ServiceURLPrefix "/services"
</IfModule>

# Service URL Location Handler
<Location "/services">
    # Require SSL and valid client certificate
    SSLRequireSSL
    SSLVerifyClient require
    Require all granted

    # Set handler to Axis2/C module
    SetHandler axis2_module

    # Cache control for dynamic responses
    Header always set Cache-Control "no-cache, no-store, must-revalidate"
</Location>
