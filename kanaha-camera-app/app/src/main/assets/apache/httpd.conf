# Apache httpd Configuration for Kanaha Camera Control System
# HTTP/2 + mTLS Camera Control Server
#
# This configuration enables:
# 1. HTTP/2 support for high-performance camera streaming
# 2. mTLS authentication for secure multi-camera networks
# 3. Axis2/C integration for JSON-RPC camera control
# 4. SSL/TLS encryption for all communications
#
# NOTE: This httpd binary has modules statically linked:
#   - mod_ssl, mod_http2, mod_authz_core, mod_dir, mod_mime,
#   - mod_log_config, mod_headers, mod_rewrite, mod_unixd
# No LoadModule directives needed for these modules.

# Basic server configuration
# ServerRoot is set via -d command line argument
PidFile "logs/httpd.pid"
ErrorLog "logs/error_log"
LogLevel info

# Listen on HTTPS port 8443 (non-privileged for Android)
# Android cannot bind to port 443 without root
Listen 8443

# Server identification (will be replaced dynamically)
ServerName {{KANAHA_HOSTNAME}}:8443
ServerAdmin admin@kanaha.local

# Document root (relative to ServerRoot)
DocumentRoot "htdocs"

# Default directory permissions
<Directory "htdocs">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Directory index files
DirectoryIndex index.html index.htm

# MIME type configuration
TypesConfig conf/mime.types

# Default charset
AddDefaultCharset UTF-8

# HTTP/2 Configuration
# Enable HTTP/2 for enhanced performance
Protocols h2 http/1.1
H2Direct on
H2Push on
H2PushPriority *                       after
H2PushPriority text/css                before
H2PushPriority image/png               after   32
H2PushPriority image/jpeg              after   32
H2PushPriority application/javascript  interleaved

# SSL/TLS Configuration for mTLS
<IfModule mod_ssl.c>
    # Include SSL-specific configuration
    Include conf/ssl.conf
</IfModule>

# HTTP/2 Performance Optimization
<IfModule mod_http2.c>
    # Include HTTP/2 performance configuration
    Include conf/http2-performance.conf
</IfModule>

# Axis2/C Configuration for Camera Control Services
<IfModule mod_axis2.c>
    # Include Axis2/C-specific configuration
    Include conf/axis2.conf
</IfModule>

# Security headers for enhanced protection
<IfModule mod_headers.c>
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>

# ========================================================================
# Rate Limiting and DoS Protection
# Core Apache limits (always available) + mod_ratelimit (if built)
# ========================================================================

# Request size limits - prevent oversized payload attacks
# JSON-RPC requests should be small; 64KB is generous
LimitRequestBody 65536

# Limit request header size (default 8190, reduce for embedded)
LimitRequestFieldSize 4096

# Limit number of request headers
LimitRequestFields 50

# Limit request line length (URL + method + protocol)
LimitRequestLine 4096

# Connection timeout - closes idle connections (Slowloris mitigation)
Timeout 30

# mod_reqtimeout - more granular timeout control (if available)
<IfModule mod_reqtimeout.c>
    # Limit time to receive request headers: 10s initial, +1s per 500 bytes
    RequestReadTimeout header=10-20,MinRate=500
    # Limit time to receive request body: 10s initial, +1s per 1000 bytes
    RequestReadTimeout body=10-30,MinRate=1000
</IfModule>

# mod_ratelimit - bandwidth limiting per connection (if available)
# Add mod_ratelimit to httpd build to enable this
<IfModule mod_ratelimit.c>
    <Location "/services">
        # Limit to 50 KB/s per connection - prevents bandwidth exhaustion
        SetOutputFilter RATE_LIMIT
        SetEnv rate-limit 50
    </Location>
</IfModule>

# ========================================================================
# User-Agent Security Filtering (requires mod_setenvif)
# Block known security scanning/testing tools
# Allow: curl, wget, httpie, python-requests, libcurl, OpenSSL
# Block: Burp Suite, OWASP ZAP, Nikto, sqlmap, and similar
# ========================================================================

<IfModule mod_setenvif.c>
    # Mark requests from blocked user agents
    SetEnvIfNoCase User-Agent "burp" blocked_ua=1
    SetEnvIfNoCase User-Agent "burpsuite" blocked_ua=1
    SetEnvIfNoCase User-Agent "owasp" blocked_ua=1
    SetEnvIfNoCase User-Agent "zap" blocked_ua=1
    SetEnvIfNoCase User-Agent "nikto" blocked_ua=1
    SetEnvIfNoCase User-Agent "sqlmap" blocked_ua=1
    SetEnvIfNoCase User-Agent "nmap" blocked_ua=1
    SetEnvIfNoCase User-Agent "masscan" blocked_ua=1
    SetEnvIfNoCase User-Agent "nessus" blocked_ua=1
    SetEnvIfNoCase User-Agent "openvas" blocked_ua=1
    SetEnvIfNoCase User-Agent "acunetix" blocked_ua=1
    SetEnvIfNoCase User-Agent "appscan" blocked_ua=1
    SetEnvIfNoCase User-Agent "webscarab" blocked_ua=1
    SetEnvIfNoCase User-Agent "arachni" blocked_ua=1
    SetEnvIfNoCase User-Agent "w3af" blocked_ua=1
    SetEnvIfNoCase User-Agent "skipfish" blocked_ua=1
    SetEnvIfNoCase User-Agent "gobuster" blocked_ua=1
    SetEnvIfNoCase User-Agent "dirbuster" blocked_ua=1
    SetEnvIfNoCase User-Agent "wfuzz" blocked_ua=1
    SetEnvIfNoCase User-Agent "ffuf" blocked_ua=1
    SetEnvIfNoCase User-Agent "nuclei" blocked_ua=1
    SetEnvIfNoCase User-Agent "jaeles" blocked_ua=1
    SetEnvIfNoCase User-Agent "metasploit" blocked_ua=1
    SetEnvIfNoCase User-Agent "hydra" blocked_ua=1
    SetEnvIfNoCase User-Agent "medusa" blocked_ua=1
    SetEnvIfNoCase User-Agent "havij" blocked_ua=1
    SetEnvIfNoCase User-Agent "commix" blocked_ua=1

    # Block empty or missing user agents (common in basic scans)
    SetEnvIf User-Agent "^$" blocked_ua=1
    SetEnvIf User-Agent "^-$" blocked_ua=1

    # Block generic script indicators
    SetEnvIfNoCase User-Agent "scanner" blocked_ua=1
    SetEnvIfNoCase User-Agent "exploit" blocked_ua=1
    SetEnvIfNoCase User-Agent "attack" blocked_ua=1
    SetEnvIfNoCase User-Agent "inject" blocked_ua=1
    SetEnvIfNoCase User-Agent "hack" blocked_ua=1

    # Deny access to blocked user agents
    <Location "/">
        <RequireAll>
            Require all granted
            Require not env blocked_ua
        </RequireAll>
    </Location>
</IfModule>

# Compression for better performance (requires mod_deflate and mod_setenvif)
<IfModule mod_deflate.c>
    <IfModule mod_setenvif.c>
        SetOutputFilter DEFLATE
        SetEnvIfNoCase Request_URI \
            \.(?:gif|jpe?g|png)$ no-gzip dont-vary
        SetEnvIfNoCase Request_URI \
            \.(?:exe|t?gz|zip|bz2|sit|rar)$ no-gzip dont-vary
    </IfModule>
</IfModule>

# Log format for debugging
# Note: %O removed (requires mod_logio)
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog "logs/access_log" combined

# Security audit log - tracks client certificate identity for all requests
# Format: timestamp | client_ip | cert_subject | request | status | bytes
# Use for: incident response, access auditing, anomaly detection
LogFormat "%t|%h|%{SSL_CLIENT_S_DN}x|%{SSL_CLIENT_VERIFY}x|\"%r\"|%>s|%b" mtls_audit
CustomLog "logs/audit.log" mtls_audit

# Error pages
ErrorDocument 500 "Internal Server Error - Camera Control Service Unavailable"
ErrorDocument 403 "Access Forbidden - Valid Client Certificate Required"
ErrorDocument 404 "Not Found - Camera Service Endpoint Not Available"

# Keep alive settings for persistent connections
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5

# Worker MPM settings (Android-optimized for HTTP/2 support)
# Worker MPM uses threads within processes, enabling HTTP/2
<IfModule mpm_worker_module>
    StartServers          1
    MinSpareThreads       1
    MaxSpareThreads       4
    ThreadsPerChild       4
    MaxRequestWorkers     16
    MaxConnectionsPerChild 0
</IfModule>